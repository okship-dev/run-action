name: 'OKShip Run'
description: 'Trigger an OKShip evidence-generation run from CI. Optionally wait for the verdict and fail the job unless every scenario passed.'
author: 'okship-dev'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  api_key:
    description: 'OKShip API key. Generate one in your OKShip dashboard and store in repo secrets (e.g. secrets.OKSHIP_API_KEY). It needs the Start runs scope, and also the Read scope when wait_for_completion is true (the verdict is read through OKShip MCP).'
    required: true
  app_id:
    description: 'OKShip app UUID to run scenarios against.'
    required: true
  scenarios:
    description: 'Optional comma-separated scenario UUIDs. Defaults to all scenarios on the app.'
    required: false
  wait_for_completion:
    description: 'If true (default), wait until the run finishes and fail the job unless the verdict is pass: a fail, not sure (ambiguous), mixed, a withheld verdict, a failed or cancelled run, and a timeout all fail it. If false, return immediately after the run is enqueued.'
    required: false
    default: 'true'
  timeout_minutes:
    description: 'How long to wait for the verdict, in whole minutes, from 1 to 120. Default 30. The run keeps going after a timeout, but the job fails.'
    required: false
    default: '30'
  okship_api_base:
    description: 'OKShip API base URL. Defaults to https://okship.dev. Set it only to point the action at a different OKShip deployment.'
    required: false
    default: 'https://okship.dev'

outputs:
  run_id:
    description: 'The OKShip run UUID. Always set after a successful trigger.'
  run_url:
    description: 'Direct link to the run in the OKShip dashboard. Always set after a successful trigger.'
  verdict:
    description: 'Run outcome: pass | fail | mixed | ambiguous. Only set when wait_for_completion=true AND the run finished with a verdict OKShip returned.'

runs:
  using: 'node24'
  main: 'dist/index.js'
