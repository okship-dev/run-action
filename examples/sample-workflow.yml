# Example workflow for okship-dev/run-action
#
# This workflow triggers an OKShip evidence-generation run on every push to
# main, waits for completion, and gates the build on the verdict.
#
# Requirements:
#   - Your OKShip organisation has its own Anthropic key saved and a connected
#     GitHub Actions integration (both under Settings in the OKShip dashboard).
#
# Setup:
#   1. Have an organisation owner generate an OKShip API key in the dashboard
#      (Settings → API keys).
#   2. Add it as a repository secret named OKSHIP_API_KEY.
#   3. Replace <your-app-uuid> with your OKShip app's UUID.
#
# Pinning: @v0.1.0 pins a tag. A full commit SHA is the strictest pin.

name: OKShip CI run

on:
  push:
    branches: [main]

jobs:
  okship:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OKShip evidence-generation run
        id: okship_run
        uses: okship-dev/run-action@v0.1.0
        with:
          api_key: ${{ secrets.OKSHIP_API_KEY }}
          app_id: <your-app-uuid>
          # The gate below needs a verdict, so keep waiting for completion.
          wait_for_completion: true

      # Stops the build on any verdict other than pass, and on no verdict at
      # all (run failed, cancelled, verdict withheld, or polling timed out).
      - name: Stop the build unless every goal passed
        if: steps.okship_run.outputs.verdict != 'pass'
        run: |
          echo "OKShip verdict: ${{ steps.okship_run.outputs.verdict || 'no verdict' }}"
          echo "Review the run: ${{ steps.okship_run.outputs.run_url }}"
          exit 1
